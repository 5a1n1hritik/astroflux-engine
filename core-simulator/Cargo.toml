[package]
name = "core-simulator"
version = "0.1.0"
edition = "2024"

[lib]
# cdylib (C Dynamic Library) compile targets engine ko batata hai ki hum ek 
# assembly target generate kar rahe hain jise JavaScript engine runtime load karega
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.116"

# Code optimization settings for final production build
[profile.release]
opt-level = 3        # Maximum code speed optimizations triggers
lto = true           # Link Time Optimization for smaller binary sizes
panic = "abort"      # Disables stack unwinding to keep WASM lightweight