[package]
name = "core-simulator"
version = "3.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.116"
serde-wasm-bindgen = "0.6.5"

[profile.release]
opt-level = 3
lto = true
panic = "abort"